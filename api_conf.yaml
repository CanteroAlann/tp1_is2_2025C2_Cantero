openapi: 3.0.0
info:
  title: Melodia Playlist Service API
  version: 1.0.0

servers:
  - url: http://localhost:3000
    description: Local backend server

paths:
  /songs:
    post:
      summary: Create a new song
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSongRequest"
      responses:
        "201":
          description: Song created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Song"
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Retrieve all songs
      responses:
        "200":
          description: A list of songs
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Song"

  /songs/{id}:
    get:
      summary: Retrieve a song by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Song retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Song"
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    put:
      summary: Update a song by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSongRequest"
      responses:
        "200":
          description: Song updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Song"
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a song by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Song deleted successfully
        "404":
          description: Song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /playlists:
    post:
      summary: Create a new playlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistRequest"
      responses:
        "201":
          description: Playlist created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    get:
      summary: Retrieve playlists (filter by published)
      description: By default returns only published playlists ordered by publishedAt desc.
      parameters:
        - in: query
          name: published
          required: false
          schema:
            type: boolean
            default: true
          description: If true (default), only published playlists are returned. If false, returns all playlists.
        - in: query
          name: sort
          required: false
          schema:
            type: string
            default: publishedAt
          description: Sort expression (e.g., -publishedAt).
      responses:
        "200":
          description: A list of playlists
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Playlist"

  /playlists/{id}:
    get:
      summary: Retrieve a playlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playlist retrieved successfully (songs ordered by addedAt desc)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Playlist"
        "404":
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      summary: Delete a playlist by ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Playlist deleted successfully
        "404":
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /playlists/{id}/songs:
    post:
      summary: Add a song to a playlist
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddSongToPlaylistRequest"
      responses:
        "200":
          description: Song added to playlist successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Playlist"
        "400":
          description: Bad request error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Playlist or song not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /playlists/{id}/publish:
    post:
      summary: Publish a playlist (idempotent)
      description: Sets isPublished=true and publishedAt=now() if not already published.
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Playlist published
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/Playlist"
        "404":
          description: Playlist not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    Song:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string

    CreateSongRequest:
      type: object
      required:
        - title
        - artist
      properties:
        title:
          type: string
        artist:
          type: string

    UpdateSongRequest:
      type: object
      properties:
        title:
          type: string
        artist:
          type: string

    PlaylistSong:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        artist:
          type: string
        addedAt:
          type: string
          format: date-time
          description: Timestamp when the song was added to the playlist

    Playlist:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        isPublished:
          type: boolean
          description: Visibility flag. In the optional publish variant it starts as false until /publish is called.
        publishedAt:
          type: string
          format: date-time
          nullable: true
          description: Publish timestamp. Omitted or null until the playlist is published.
        songs:
          type: array
          items:
            $ref: "#/components/schemas/PlaylistSong"

    CreatePlaylistRequest:
      type: object
      required:
        - name
        - description
      properties:
        name:
          type: string
        description:
          type: string

    AddSongToPlaylistRequest:
      type: object
      required:
        - songId
      properties:
        songId:
          type: string

    ErrorResponse:
      type: object
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
